<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stanza degli ospiti.</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .post {
            border-bottom: 1px solid #ccc;
            padding: 15px 0;
        }

        .post-name {
            font-weight: bold;
        }

        .post-date {
            font-size: 12px;
            color: #777;
        }

        .delete-button {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>

<body>

    <h1>Stanza degli ospiti.</h1>

    <h4>
        オープンチャットができない人や、オプが何かしらの理由で使えなくなった時に使える掲示板です。
        互いに思いやりの心をもって利用してくださいね。
    </h4>

    <input
        type="text"
        id="name"
        placeholder="名前"
        maxlength="20"
    >

    <textarea
        id="message"
        placeholder="メッセージ（500字まで）"
        rows="4"
        maxlength="500"
    ></textarea>

    <button id="postButton">
        投稿する
    </button>

    <div id="board"></div>


    <script>
        console.log("JavaScriptは読み込まれています");


        // ==========================================
        // CookieからユーザーIDを取得
        // ==========================================

        function getCookie(name) {

            const cookies = document.cookie.split("; ");

            for (const cookie of cookies) {

                const parts = cookie.split("=");

                const key = parts.shift();

                const value = parts.join("=");

                if (key === name) {
                    return decodeURIComponent(value);
                }
            }

            return null;
        }


        // ==========================================
        // Cookieを保存
        // ==========================================

        function setCookie(name, value, days) {

            const date = new Date();

            date.setTime(
                date.getTime() +
                days * 24 * 60 * 60 * 1000
            );

            document.cookie =
                name +
                "=" +
                encodeURIComponent(value) +
                "; expires=" +
                date.toUTCString() +
                "; path=/; SameSite=Lax";
        }


        // ==========================================
        // 自分のユーザーID
        // ==========================================

        let myUserId =
            getCookie("boardUserId");


        if (!myUserId) {

            myUserId =
                crypto.randomUUID();

            setCookie(
                "boardUserId",
                myUserId,
                365
            );
        }


        // ==========================================
        // 投稿ボタン
        // ==========================================

        document
            .getElementById("postButton")
            .addEventListener(
                "click",
                function () {

                    console.log("投稿ボタンが押されました");


                    const name =
                        document
                            .getElementById("name")
                            .value
                            .trim();


                    const message =
                        document
                            .getElementById("message")
                            .value
                            .trim();


                    if (!name || !message) {

                        alert(
                            "名前とメッセージを入力してください。"
                        );

                        return;
                    }


                    // 仮投稿を表示
                    addPost(
                        name,
                        message
                    );


                    // メッセージ欄を空にする

                    document
                        .getElementById("message")
                        .value = "";

                }
            );


        // ==========================================
        // 投稿表示
        // ==========================================

        function addPost(
            name,
            message
        ) {

            const board =
                document.getElementById("board");


            const post =
                document.createElement("div");

            post.className =
                "post";


            const nameElement =
                document.createElement("div");

            nameElement.className =
                "post-name";

            nameElement.textContent =
                name;


            const dateElement =
                document.createElement("div");

            dateElement.className =
                "post-date";

            dateElement.textContent =
                new Date().toLocaleString(
                    "ja-JP"
                );


            const messageElement =
                document.createElement("p");

            messageElement.textContent =
                message;


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "この投稿を削除";


            deleteButton.addEventListener(
                "click",
                function () {

                    post.remove();

                }
            );


            post.appendChild(
                nameElement
            );

            post.appendChild(
                dateElement
            );

            post.appendChild(
                messageElement
            );

            post.appendChild(
                deleteButton
            );


            board.prepend(post);
        }

    </script>

</body>
</html>
