<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>避難用簡易掲示板</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }

        .post {
            border-bottom: 1px solid #ccc;
            padding: 10px 0;
        }

        .post-name {
            font-weight: bold;
            color: #333;
        }

        .post-date {
            font-size: 0.8em;
            color: black;
        }

        .post-content {
            background-color: white;
        }

        textarea,
        input {
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        /* 自分の投稿の削除ボタン */
        .delete-button {
            color: #ff5555;
            background-color: white;
            border: 1px solid #ff5555;
            padding: 5px 10px;
            border-radius: 100px;
            cursor: pointer;
        }

        /* 管理者の削除ボタン */
        .admin-delete-button {
            color: white;
            background-color: #ff5555;
            border: 1px solid #ff5555;
            padding: 5px 10px;
            border-radius: 100px;
            cursor: pointer;
        }

        /* 管理者ログイン */
        .admin-login {
            margin-top: 20px;
            color: #555;
        }

        #adminStatus {
            color: #d33;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>

    <link type="text/css" rel="stylesheet" href="css/style.css"/>
</head>

<body>

    <h1>Stanza degli ospiti.</h1>

    <h4>
        オープンチャットができない人や、オプが何かしらの理由で使えなくなった時に使える掲示板です。
        互いに思いやりの心をもって利用してくださいね。
    </h4>

    <input
        type="text"
        id="name"
        placeholder="名前"
        maxlength="20"
    >

    <textarea
        id="message"
        placeholder="メッセージ（500字まで）"
        rows="4"
        maxlength="500"
    ></textarea>

    <button
        onclick="postMessage()"
        style="
            color: #7fd382;
            border-color:#ffee00 #ffcc11;
            padding: 10px 20px;
            border-radius: 100px;
        "
    >
        投稿する
    </button>


    <!-- 管理者ログイン -->
    <div class="admin-login">

        <button onclick="adminLogin()">
            管理者ログイン
        </button>

        <span id="adminStatus"></span>

    </div>


    <div id="board"></div>


 <script type="module">

// ==========================================
// Firebase SDK
// ==========================================

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    query,
    orderBy,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


// ==========================================
// Firebase設定
// ==========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDN1vheeWKo6QJvLEXhtt0QU0arNhULAwc",

    authDomain:
        "evacuation-board.firebaseapp.com",

    projectId:
        "evacuation-board",

    storageBucket:
        "evacuation-board.firebasestorage.app",

    messagingSenderId:
        "1047804217538",

    appId:
        "1:1047804217538:web:a6c93f2b55937b1805535b"
};


// ==========================================
// Firebase開始
// ==========================================

const app =
    initializeApp(firebaseConfig);


// ==========================================
// Firestore
// ==========================================

const db =
    getFirestore(app);


// ==========================================
// 投稿コレクション
// ==========================================

const postsRef =
    collection(
        db,
        "boardPosts"
    );


// ==========================================
// 管理者パスワード
// ==========================================

// 必ず自分のパスワードに変更してください。

const ADMIN_PASSWORD =
    "ここに管理者パスワード";


// ==========================================
// Cookie
// ==========================================

function getCookie(name) {

    const cookies =
        document.cookie.split("; ");

    for (
        const cookie of cookies
    ) {

        const parts =
            cookie.split("=");

        const key =
            parts.shift();

        const value =
            parts.join("=");

        if (key === name) {

            return decodeURIComponent(
                value
            );
        }
    }

    return null;
}


function setCookie(
    name,
    value,
    days
) {

    const date =
        new Date();

    date.setTime(
        date.getTime() +
        days *
        24 *
        60 *
        60 *
        1000
    );

    document.cookie =
        name +
        "=" +
        encodeURIComponent(value) +
        "; expires=" +
        date.toUTCString() +
        "; path=/; SameSite=Lax";
}


// ==========================================
// 自分のユーザーID
// ==========================================

let myUserId =
    getCookie("boardUserId");


if (!myUserId) {

    myUserId =
        crypto.randomUUID();

    setCookie(
        "boardUserId",
        myUserId,
        365
    );
}


// ==========================================
// 管理者状態
// ==========================================

let isAdmin = false;


// ==========================================
// XSS対策
// ==========================================

function escapeHTML(str) {

    return str.replace(
        /[&"<>]/g,
        (m) => ({

            "&": "&amp;",
            '"': "&quot;",
            "<": "&lt;",
            ">": "&gt;"

        })[m]
    );
}


// ==========================================
// 投稿
// ==========================================

async function postMessage() {

    const nameInput =
        document.getElementById(
            "name"
        );

    const messageInput =
        document.getElementById(
            "message"
        );


    const name =
        nameInput.value.trim();

    const message =
        messageInput.value.trim();


    // 空欄チェック

    if (
        !name ||
        !message
    ) {

        alert(
            "名前とメッセージを入力してください。"
        );

        return;
    }


    try {

        await addDoc(
            postsRef,
            {

                userId:
                    myUserId,

                name:
                    name,

                message:
                    message,

                date:
                    new Date()
                        .toLocaleString(
                            "ja-JP"
                        ),

                createdAt:
                    Date.now()
            }
        );


        // メッセージ欄を空にする

        messageInput.value = "";


    } catch (error) {

        console.error(
            "投稿エラー:",
            error
        );

        alert(
            "投稿に失敗しました。"
        );
    }
}


// ==========================================
// 投稿削除
// ==========================================

async function deletePost(
    postId,
    userId
) {

    const isMyPost =
        userId === myUserId;


    // 自分でも管理者でもない

    if (
        !isMyPost &&
        !isAdmin
    ) {

        alert(
            "この投稿を削除する権限がありません。"
        );

        return;
    }


    // 確認

    let message;

    if (
        isAdmin &&
        !isMyPost
    ) {

        message =
            "管理者権限でこの投稿を削除しますか？";

    } else {

        message =
            "この投稿を削除しますか？";
    }


    if (
        !confirm(message)
    ) {

        return;
    }


    try {

        await deleteDoc(
            doc(
                db,
                "boardPosts",
                postId
            )
        );

    } catch (error) {

        console.error(
            "削除エラー:",
            error
        );

        alert(
            "削除に失敗しました。"
        );
    }
}


// ==========================================
// 管理者ログイン
// ==========================================

function adminLogin() {

    // 管理者モード中ならログアウト

    if (isAdmin) {

        isAdmin = false;

        document.getElementById(
            "adminStatus"
        ).textContent = "";

        displayPosts();

        alert(
            "管理者モードを終了しました。"
        );

        return;
    }


    const password =
        prompt(
            "管理者パスワードを入力してください。"
        );


    if (
        password === null
    ) {

        return;
    }


    if (
        password ===
        ADMIN_PASSWORD
    ) {

        isAdmin = true;

        document.getElementById(
            "adminStatus"
        ).textContent =
            "【管理者モード】";

        alert(
            "管理者としてログインしました。"
        );

        displayPosts();

    } else {

        alert(
            "パスワードが違います。"
        );
    }
}


// ==========================================
// 投稿一覧
// ==========================================

let currentPosts = [];


// ==========================================
// 投稿表示
// ==========================================

function displayPosts() {

    const board =
        document.getElementById(
            "board"
        );


    board.innerHTML = "";


    currentPosts.forEach(
        p => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "post";


            // 名前

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "post-name";

            name.textContent =
                p.name;


            // 日付

            const date =
                document.createElement(
                    "div"
                );

            date.className =
                "post-date";

            date.textContent =
                p.date;


            // メッセージ

            const message =
                document.createElement(
                    "p"
                );

            message.className =
                "post-content";

            message.textContent =
                p.message;


            div.appendChild(
                name
            );

            div.appendChild(
                date
            );

            div.appendChild(
                message
            );


            // ==================================
            // 自分の投稿
            // ==================================

            if (
                p.userId ===
                myUserId
            ) {

                const button =
                    document.createElement(
                        "button"
                    );

                button.textContent =
                    "この投稿を削除";

                button.className =
                    "delete-button";


                button.onclick =
                    function () {

                        deletePost(
                            p.id,
                            p.userId
                        );

                    };


                div.appendChild(
                    button
                );
            }


            // ==================================
            // 管理者
            // ==================================

            if (
                isAdmin &&
                p.userId !== myUserId
            ) {

                const button =
                    document.createElement(
                        "button"
                    );

                button.textContent =
                    "管理者：この投稿を削除";

                button.className =
                    "admin-delete-button";


                button.onclick =
                    function () {

                        deletePost(
                            p.id,
                            p.userId
                        );

                    };


                div.appendChild(
                    button
                );
            }


            board.appendChild(
                div
            );

        }
    );
}


// ==========================================
// Firestoreをリアルタイム監視
// ==========================================

const postsQuery =
    query(
        postsRef,
        orderBy(
            "createdAt",
            "desc"
        )
    );


onSnapshot(
    postsQuery,

    function(snapshot) {

        currentPosts =
            snapshot.docs.map(
                document => ({

                    id:
                        document.id,

                    ...document.data()

                })
            );


        displayPosts();

    },

    function(error) {

        console.error(
            "Firestoreエラー:",
            error
        );

        alert(
            "掲示板の読み込みに失敗しました。"
        );
    }
);


// ==========================================
// ページのボタン
// ==========================================

document
    .querySelector(
        'button[onclick="postMessage()"]'
    )
    .onclick =
    postMessage;


document
    .querySelector(
        'button[onclick="adminLogin()"]'
    )
    .onclick =
    adminLogin;

</script>

    <script
        type="text/javascript"
        src="js/script.js">
    </script>

</body>
</html>
